# /etc/nginx/sites-available/ttokbo-top → sites-enabled 링크. HTTPS(443) 블록과 www→ttokbo.top 이동은 certbot 이후 추가한다.
# 예전 주소(ttokbo.27-96-150-212.sslip.io)는 별도 파일에서 https://ttokbo.top 으로 301 이동한다.
server {
    listen 80;
    server_name ttokbo.top www.ttokbo.top;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 실시간 순번(/api/stream, SSE)이 끊기지 않게 버퍼링을 끄고 오래 연결을 유지한다
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
